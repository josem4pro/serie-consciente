<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Estudio de Movimiento · Acceso privado</title>
<meta name="robots" content="noindex, nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300&family=Jost:wght@300;400&family=IBM+Plex+Mono:wght@400&display=swap" rel="stylesheet">
<style>
:root{--ink:#0B0A09;--champ:#CFB787;--champ-2:#E9DBBB;--oro:#B08D52;--crema:#F5F1EA;--linea:rgba(207,183,135,.25);color-scheme:dark}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:radial-gradient(ellipse 60% 55% at 50% 45%,#2a2119 0%,var(--ink) 70%);color:var(--crema);font-family:"Jost","Helvetica Neue",sans-serif;font-weight:300;display:grid;place-items:center;padding:24px 16px}
main{width:min(440px,100%);text-align:center}
.marca{font-family:"Cormorant Garamond",Georgia,serif;font-size:36px;font-weight:400;letter-spacing:.015em}
.marca em{font-weight:300;background:linear-gradient(180deg,#F3E6C4 15%,#CFB787 60%,#A8864A);-webkit-background-clip:text;background-clip:text;color:transparent}
.lugar{font-size:11px;letter-spacing:.7em;text-transform:uppercase;color:var(--champ);margin:8px 0 44px;padding-left:.7em}
p{font-size:17px;color:rgba(245,241,234,.75);margin-bottom:22px}
form{display:flex;flex-direction:column;gap:12px}
label{font-family:"IBM Plex Mono",monospace;font-size:11.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--champ);text-align:left}
input{font:inherit;font-size:18px;color:var(--crema);background:rgba(255,255,255,.05);border:1px solid var(--linea);border-radius:14px;padding:14px 18px;outline:none}
input:focus{border-color:var(--champ)}
button{font:inherit;font-size:16px;font-weight:400;letter-spacing:.03em;border:0;border-radius:100px;padding:16px 28px;cursor:pointer;color:var(--ink);background:linear-gradient(135deg,var(--champ-2),var(--champ) 45%,var(--oro))}
button:disabled{opacity:.6;cursor:wait}
button:focus-visible,input:focus-visible{outline:2px solid var(--champ-2);outline-offset:3px}
.error{min-height:24px;font-size:15px;color:#e8a598}
</style>
</head>
<body>
<main>
  <div class="marca">Estudio de <em>Movimiento</em></div>
  <div class="lugar">Tenerife</div>
  <p>Esta página es privada. Introduce la contraseña para verla.</p>
  <form id="f">
    <label for="clave">Contraseña</label>
    <input id="clave" type="password" autocomplete="current-password" autofocus required>
    <button id="entrar" type="submit">Entrar</button>
    <div class="error" id="error" role="alert"></div>
  </form>
</main>
<script>
(() => {
  const SALT = "utDcwgBnwb2IiNKnfT4S6A==", IV = "mRqOI/x8nZx0ojbJ", IT = 600000;
  const bin = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
  const f = document.getElementById('f'), clave = document.getElementById('clave'),
        boton = document.getElementById('entrar'), error = document.getElementById('error');
  let datos = null;

  async function abrir(pw) {
    datos = datos || await (await fetch('contenido.bin', { cache: 'no-cache' })).text();
    const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(pw), 'PBKDF2', false, ['deriveKey']);
    const key = await crypto.subtle.deriveKey({ name: 'PBKDF2', salt: bin(SALT), iterations: IT, hash: 'SHA-256' }, base, { name: 'AES-GCM', length: 256 }, false, ['decrypt']);
    const plano = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: bin(IV) }, key, bin(datos));
    const { html, assets } = JSON.parse(new TextDecoder().decode(plano));
    let pagina = html;
    for (const [ruta, [tipo, b64]] of Object.entries(assets)) {
      const url = URL.createObjectURL(new Blob([bin(b64)], { type: tipo }));
      pagina = pagina.split(ruta).join(url);
    }
    try { sessionStorage.setItem('em-clave', pw); } catch (e) {}
    document.open(); document.write(pagina); document.close();
  }

  f.addEventListener('submit', async e => {
    e.preventDefault();
    boton.disabled = true; boton.textContent = 'Abriendo…'; error.textContent = '';
    try { await abrir(clave.value); }
    catch (err) {
      try { sessionStorage.removeItem('em-clave'); } catch (e) {}
      boton.disabled = false; boton.textContent = 'Entrar';
      error.textContent = err instanceof DOMException && err.name === 'OperationError'
        ? 'Contraseña incorrecta. Revísala e inténtalo de nuevo.'
        : 'No se pudo cargar la página. Comprueba la conexión y vuelve a intentarlo.';
      clave.select();
    }
  });

  let guardada = null;
  try { guardada = sessionStorage.getItem('em-clave'); } catch (e) {}
  if (guardada) abrir(guardada).catch(() => { try { sessionStorage.removeItem('em-clave'); } catch (e) {} });
})();
</script>
</body>
</html>
